[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/calendar/feed"
  to = "/.netlify/functions/calendar-feed"
  status = 200

[[redirects]]
  from = "/api/calendar/feed/*"
  to = "/.netlify/functions/calendar-feed?feedId=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
